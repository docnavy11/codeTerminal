<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>board · code terminal</title>
<style>
  /* One kanban across every project: Queue · In progress · Needs you · Done.
     A card is a task; its project is a colored tag, the session on it is a
     name with a state dot. Sessions sit in one strip above the columns and
     are the drop targets for assigning. Design: docs/design-todos.md. */
  :root {
    --bg:#14171e; --panel:#1a1e27; --card:#1f2430; --line:#2b3140; --fg:#dfe3ec; --dim:#8b93a7; --faint:#5e6578;
    --accent:#7aa2f7; --ok:#7dcfa0; --warn:#e0af68; --bad:#f07178; --btn:#252a36; --sel:#2a3550;
    --shadow: none; --tag-s: 55%; --tag-l: 68%;
    --sans: -apple-system, "Segoe UI", system-ui, Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg:#f6f7fa; --panel:#eceef3; --card:#ffffff; --line:#dcdfe7; --fg:#1c1f26; --dim:#666d7d; --faint:#9aa0ae;
      --accent:#2f5fd0; --ok:#1f7a4d; --warn:#9a6b00; --bad:#c0392b; --btn:#e6e8ee; --sel:#dfe8fb;
      --shadow: 0 1px 2px rgba(20,24,40,.06); --tag-s: 60%; --tag-l: 42%; color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --bg:#f6f7fa; --panel:#eceef3; --card:#ffffff; --line:#dcdfe7; --fg:#1c1f26; --dim:#666d7d; --faint:#9aa0ae;
    --accent:#2f5fd0; --ok:#1f7a4d; --warn:#9a6b00; --bad:#c0392b; --btn:#e6e8ee; --sel:#dfe8fb;
    --shadow: 0 1px 2px rgba(20,24,40,.06); --tag-s: 60%; --tag-l: 42%; color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 13.5px/1.45 var(--sans); }
  .wrap { max-width: 1400px; margin: 0 auto; padding-block: 14px 48px; padding-inline: 18px; display: grid; gap: 14px; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  a { color: var(--accent); }
  button { font: inherit; font-size: 12.5px; background: var(--btn); color: var(--fg); border: 1px solid transparent; border-radius: 7px; padding: 5px 10px; cursor: pointer; }
  button:hover { border-color: var(--line); }
  button:disabled { opacity: .45; cursor: default; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button.primary { background: var(--accent); color: #fff; }
  button.ghost { background: transparent; color: var(--dim); padding: 3px 6px; }
  button.ghost:hover { color: var(--fg); background: var(--btn); }
  input, select { font: inherit; background: var(--card); color: var(--fg); border: 1px solid var(--line); border-radius: 7px; padding: 6px 9px; }
  input { width: 100%; }

  /* masthead and sessions strip */
  .mast { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .mast h1 { font-size: 16px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
  .mast .as-of { color: var(--dim); font-size: 12px; }
  .mast .msg { color: var(--bad); font-size: 12px; }
  .mast .needsyou { color: var(--warn); font-size: 12px; }
  button.tag { background: none; border: 0; padding: 0; cursor: pointer; border-radius: 4px; }
  button.tag:hover { color: var(--fg); }
  button.pill { cursor: pointer; text-align: left; }
  .mast .right { margin-left: auto; display: flex; gap: 10px; align-items: center; font-size: 12px; }
  .chips { display: inline-flex; gap: 6px; }
  .sessions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .sessions .lbl { color: var(--dim); font-size: 12px; margin-right: 2px; }
  .pill { display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px 4px 8px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); font-size: 12.5px; color: inherit; max-width: 100%; cursor: pointer; text-align: left; }
  .pill:hover { border-color: var(--accent); }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
  .pill.idle .dot { background: var(--ok); } .pill.busy .dot, .pill.working .dot { background: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); } .pill.waiting .dot { background: var(--warn); }
  .pill .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill .sub { color: var(--dim); font-size: 11.5px; white-space: nowrap; }
  .pill.selected { background: var(--sel); border-color: var(--accent); }
  .pill.toggle { color: var(--dim); font-weight: 500; }
  .pill.toggle .name { font-weight: 500; }
  button.tag.on span { color: var(--fg); text-decoration: underline; text-underline-offset: 2px; }
  .add { display: flex; gap: 8px; flex-wrap: wrap; }
  .add select { flex: 0 0 auto; } .add input { flex: 1 1 260px; min-width: 0; }

  /* the top board: Queue | In progress (sessions as containers) | Needs you; then the Done board */
  .board { display: grid; gap: 18px; }
  .cols { display: grid; grid-template-columns: minmax(230px, 1fr) minmax(0, 1.6fr) minmax(230px, 1fr); gap: 12px; align-items: start; }
  @media (max-width: 1000px) { .cols { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .col.progress { grid-column: 1 / -1; order: -1; } }
  @media (max-width: 640px) { .cols { grid-template-columns: 1fr; } }
  .col { background: var(--panel); border-radius: 12px; padding: 10px; display: grid; gap: 8px; align-content: start; min-width: 0; min-height: 120px; }
  .col > .hd, .lanehd { display: flex; align-items: baseline; gap: 8px; padding: 2px 4px 4px; font-weight: 600; font-size: 12.5px; min-width: 0; }
  .col > .hd .n, .lanehd .n { color: var(--dim); font-weight: 400; }
  .col.needs > .hd { color: var(--warn); }
  .empty { color: var(--faint); font-size: 12.5px; padding: 14px 8px; text-align: center; }
  .sbox { border: 1px solid var(--line); border-radius: 10px; padding: 8px; display: grid; gap: 8px; background: color-mix(in srgb, var(--card) 40%, var(--panel)); }
  .sbox.busy, .sbox.working { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
  .sbox.waiting { border-color: color-mix(in srgb, var(--warn) 55%, var(--line)); }
  .sboxhd { display: flex; align-items: center; gap: 7px; min-width: 0; font-size: 12.5px; padding: 0 2px; }
  .sboxhd .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
  .sbox.idle .sboxhd .dot { background: var(--ok); } .sbox.busy .sboxhd .dot, .sbox.working .sboxhd .dot { background: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); } .sbox.waiting .sboxhd .dot { background: var(--warn); }
  .sboxhd .name { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: inherit; text-decoration: none; min-width: 0; }
  .sboxhd a.name:hover { text-decoration: underline; }
  .sboxhd .kind { font-size: 10.5px; color: var(--dim); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; flex: none; }
  .sboxhd .meta { margin-left: auto; color: var(--dim); font-size: 11px; white-space: nowrap; }
  .sbox .card { box-shadow: none; }
  .slot { border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; color: var(--faint); font-size: 12.5px; display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; min-height: 44px; }
  .slot.droppable { border-color: var(--accent); color: var(--dim); }
  .slot.over { background: var(--sel); }
  .doneboard { display: grid; gap: 6px; }
  .scroller { overflow-x: auto; min-width: 0; padding-bottom: 4px; }
  .dcols { display: grid; gap: 12px; align-items: start; }
  .col.dcol > .hd.sess { gap: 7px; align-items: center; }
  .hd.sess .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
  .hd.sess .dot.idle { background: var(--ok); } .hd.sess .dot.busy, .hd.sess .dot.working { background: var(--accent); } .hd.sess .dot.waiting { background: var(--warn); }
  .hd.sess .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .hd.sess .n { margin-left: auto; }
  /* cards */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px 8px; display: grid; gap: 6px; box-shadow: var(--shadow); min-width: 0; }
  .card.q { cursor: grab; } .card.q:hover { border-color: var(--accent); }
  .card.dragging { opacity: .45; } .card.dragover { outline: 2px dashed var(--accent); outline-offset: -2px; }
  .card.needs { border-color: color-mix(in srgb, var(--warn) 55%, var(--line)); }
  .card.done .text { color: var(--dim); }
  .tag { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--dim); min-width: 0; }
  .tag i { width: 7px; height: 7px; border-radius: 2px; flex: none; display: inline-block; }
  .card .top { display: flex; align-items: center; gap: 8px; }
  .card .top .acts { margin-left: auto; display: flex; gap: 1px; opacity: 0; }
  .card:hover .top .acts, .card:focus-within .top .acts { opacity: 1; }
  @media (hover: none) { .card .top .acts { opacity: 1; } }
  .card .text { overflow-wrap: anywhere; }
  .card.done .text, .card.adhoc .text { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .card .result { font-size: 12.5px; color: var(--fg); overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .card .foot { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--dim); flex-wrap: wrap; }
  .card .foot .who { display: inline-flex; align-items: center; gap: 5px; min-width: 0; }
  .card .top .who.asker { font-size: 12.5px; font-weight: 600; color: var(--fg); display: inline-flex; align-items: center; gap: 5px; min-width: 0; }
  .card .top .who.asker .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
  .card .top .who.asker.idle .dot { background: var(--ok); } .card .top .who.asker.busy .dot, .card .top .who.asker.working .dot { background: var(--accent); } .card .top .who.asker.waiting .dot { background: var(--warn); }
  .card .top .who.asker .note { color: var(--dim); font-weight: 400; font-size: 11px; }
  .card .foot .who .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; }
  .card .foot .who.idle .dot { background: var(--ok); } .card .foot .who.busy .dot, .card .foot .who.working .dot { background: var(--accent); } .card .foot .who.waiting .dot { background: var(--warn); }
  .card .foot .age { margin-left: auto; }
  .card .foot .note { color: var(--faint); }
  .card .act { font-size: 11.5px; color: var(--accent); }
  .card .answer { display: grid; gap: 6px; }
  .card .answer .row { display: flex; gap: 6px; }
  .card .choose { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--dim); }
  .card .choose button { padding: 3px 9px; }
  .more { color: var(--faint); font-size: 12px; padding: 2px 6px; }
  .toast { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 7px 12px; border-radius: 8px; font-size: 12.5px; opacity: 0; transition: opacity .15s; pointer-events: none; max-width: 90vw; }
  .toast.on { opacity: .95; }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="mast">
    <h1>Board</h1>
    <span class="as-of mono" id="at"></span>
    <span class="msg" id="msg"></span>
    <span class="needsyou mono" id="needs"></span>
    <span class="chips" id="chips"></span>
    <span class="right"><button id="themebtn" class="ghost" title="Switch theme (shared with the app)">theme</button><span class="links"><a id="back" href="/">← terminal</a> <a href="/manage.html">manage</a></span></span>
  </div>
  <div class="sessions" id="sessions"></div>
  <div class="add">
    <select id="gproject" title="Which project"></select>
    <input id="gtext" placeholder="Add a task to the queue…" spellcheck="false">
    <button id="gadd" class="primary">Add</button>
  </div>
  <div class="board" id="board"></div>
</div>
<div class="toast" id="toast"></div>
<script>
  if (new URLSearchParams(location.search).get("embed") === "1") document.querySelector(".links").hidden = true;
  else if (document.referrer.includes("/m.html") || matchMedia("(max-width: 700px)").matches) { const a = document.getElementById("back"); a.href = "/m.html"; a.textContent = "← back"; }
  try { const t = new URLSearchParams(location.search).get("theme") || localStorage.getItem("ct.theme"); if (t && t !== "auto") document.documentElement.setAttribute("data-theme", t); } catch {}
</script>
<script src="/board.js"></script>
</body>
</html>
