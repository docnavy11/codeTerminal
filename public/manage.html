<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>code terminal — manage</title>
<link rel="stylesheet" href="/pages.css">

<div class="masthead">
  <div class="inner">
    <div class="top">
      <span class="dot" id="dot" title="the server is answering"></span>
      <span class="brand">code terminal</span>
      <h1>manage</h1>
      <span class="sp"></span>
      <span class="links">
        <a href="/setup.html">setup &amp; status</a>
        <a href="/" id="back">← terminal</a>
      </span>
    </div>
    <nav class="tabs">
      <button data-tab="chats" class="on">Chats <span class="n" id="n-chats"></span></button>
      <button data-tab="prompts">Prompts <span class="n" id="n-prompts"></span></button>
      <button data-tab="projects">Projects <span class="n" id="n-projects"></span></button>
      <button data-tab="browser">Browser sites <span class="n" id="n-browser"></span></button>
      <button data-tab="server">Server browser</button>
      <button data-tab="schedules">Schedules <span class="n" id="n-schedules"></span></button>
    </nav>
  </div>
</div>

<main>
  <div id="err" class="err" hidden></div>
  <p class="caption" id="caption"></p>
  <section id="chats"></section>
  <section id="prompts" hidden></section>
  <section id="projects" hidden></section>
  <section id="browser" hidden></section>
  <section id="server" hidden></section>
  <section id="schedules" hidden></section>
</main>

<script src="/vendor/marked/marked.umd.js"></script>
<script src="/vendor/dompurify/purify.min.js"></script>
<script src="/manage.js"></script>

<script>
  /* Reached from the phone's settings menu, so "back" has to mean the mobile
     UI — the desktop split view is not somewhere you want to land on a phone. */
  (() => {
    const fromMobile = document.referrer.includes("/m.html")
      || matchMedia("(max-width: 700px)").matches;
    if (!fromMobile) return;
    const a = document.getElementById("back");
    a.href = "/m.html";
    a.textContent = "← back";
  })();
</script>
