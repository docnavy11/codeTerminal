<!doctype html>
<meta charset="utf-8">
<title>code terminal</title>
<link rel="stylesheet" href="/vendor/xterm/css/xterm.css">
<link rel="stylesheet" href="/m/panel.css">
<style>
  /* Base type size — the A−/A+ buttons rewrite this, so every rem follows. */
  html { font-size: 12px; }   /* default; A−/A+ override per browser */

  :root {
    --bg:#14171e; --panel:#1a1e27; --line:#2b3140; --fg:#dfe3ec; --dim:#8b93a7;
    --accent:#7aa2f7; --ok:#7dcfa0; --warn:#e0af68; --bad:#f07178;
    --code:#0f1219; --card:#211e18; --qcard:#181d2b; --btn:#252a36; --sel:#2a3550; --inline:#222739;
    --mono: ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color-scheme: dark;
  }

  /* Light palette. Applied when the OS asks for it and you have not overridden,
     and again when you pick light explicitly, so the toggle wins both ways. */
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg:#fbfbfd; --panel:#f1f2f6; --line:#d9dce4; --fg:#1c1f26; --dim:#666d7d;
      --accent:#2f5fd0; --ok:#1f7a4d; --warn:#8a6100; --bad:#c0392b;
      --code:#f4f5f8; --card:#fdf6e6; --qcard:#eef3fd; --btn:#e6e8ee; --sel:#cfdcf7; --inline:#eceef4;
      color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --bg:#fbfbfd; --panel:#f1f2f6; --line:#d9dce4; --fg:#1c1f26; --dim:#666d7d;
    --accent:#2f5fd0; --ok:#1f7a4d; --warn:#8a6100; --bad:#c0392b;
    --code:#f4f5f8; --card:#fdf6e6; --qcard:#eef3fd; --btn:#e6e8ee; --sel:#cfdcf7; --inline:#eceef4;
    color-scheme: light;
  }
  * { box-sizing:border-box; }
  /* The UA's [hidden] rule is display:none at the weakest specificity, so any
     element with its own display (flex here) ignores it. Every toggle in this
     file uses .hidden, so make it win. */
  [hidden] { display:none !important; }
  html,body { margin:0; height:100%; overflow:hidden; }
  body { display:flex; flex-direction:column; background:var(--bg); color:var(--fg);
         font:1rem/1.45 var(--ui); }

  /* Mono is for the content, not the chrome around it. The whole document used
     to be monospace — nav, buttons, menus and all — which is what made the UI
     read as a 1980s terminal emulator rather than as an application that
     happens to contain one.

     The transcript stays monospace on purpose: it is the conversation record,
     and it is full of commands, paths and output. So does the terminal, and so
     do filesystem paths wherever they appear, including the one in the bar. */
  #log, #term,
  header .meta,
  .fpath, .flist .row .n, .flist .row .s, .fsel .n, .fview pre { font-family: var(--mono); }

  /* The split is content vs control, not inside vs outside the transcript.
     Approve/Deny, the option buttons, the card headings and the chips are
     chrome that happens to sit in the log; inheriting mono from #log is what
     kept them looking like a terminal dialog. Their code payloads stay mono —
     those are content. */
  #log button, #log .chip, #log .card h4, #log input, #log select { font-family: var(--ui); }
  #log button pre, #log .opt pre { font-family: var(--mono); }

  /* Chrome's default scrollbars are chunky and land a wide grey slab across
     every card that holds a long command. Slim them everywhere the app scrolls;
     the terminal already had its own. */
  * { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  ::-webkit-scrollbar { width:9px; height:9px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:var(--line); border-radius:5px; }
  ::-webkit-scrollbar-thumb:hover { background:var(--dim); }
  ::-webkit-scrollbar-corner { background:transparent; }


  /* ---------------- navigation bar ----------------
     Ordered by how often a thing is actually touched, not by how much room it
     had. Three tiers, left to right:

       actions   what you do repeatedly      - labelled, full contrast
       status    what you read, rarely set   - quiet until it means something
       settings  what you set once           - behind a labelled menu

     Measured (26 chat records, mostly test traffic, so weak): the permission
     mode holds 2 distinct values across all of them and tab context is on for
     68% of messages. Both are things you read, not things you operate, so
     neither earns standing weight. Frequency for the rest is NOT instrumented
     - see /usage - so their tier is a prior, not a measurement.

     Type is px, not rem: A-/A+ resizes the transcript by rewriting the root
     font-size, and while the bar inherited that, turning the reading text down
     took the navigation to 10px with it. */
  header { --nav-h:46px;
           display:flex; flex-direction:row; align-items:center; gap:10px; height:var(--nav-h);
           padding:0 14px; border-bottom:1px solid var(--line);
           background:var(--panel); flex-shrink:0; position:relative; }

  header .brand { display:flex; align-items:center; gap:9px; flex-shrink:0;
                  font-size:14px; }
  header .dot { width:9px; height:9px; border-radius:50%; background:var(--bad);
                flex-shrink:0; box-shadow:0 0 0 3px rgba(240,113,120,.20); }
  header .dot.on { background:var(--ok); box-shadow:0 0 0 3px rgba(125,207,160,.20); }

  header .grp { display:flex; align-items:center; gap:6px; flex-shrink:0; }
  header .sep { width:1px; height:20px; background:var(--line); flex-shrink:0; }

  header .nav { font:inherit; font-size:13px; line-height:1; height:28px;
                padding:0 11px; display:inline-flex; align-items:center; gap:6px;
                border:1px solid var(--line); border-radius:6px;
                background:var(--btn); color:var(--fg); cursor:pointer;
                text-decoration:none; white-space:nowrap; }
  header .nav:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }

  /* Tier 1 - the action you take most. The only filled control in the bar. */
  header .nav.primary { background:var(--accent); border-color:var(--accent);
                        color:var(--bg); font-weight:600; }
  header .nav.primary:hover { filter:brightness(1.08); color:var(--bg); }

  /* Tier 2 - status. Reads as information; still clickable, but it does not
     compete with the actions until its value is one worth noticing. */
  header .status { display:flex; align-items:center; gap:7px; flex-shrink:0;
                   min-width:0; }
  header .status .lbl { font-size:11px; color:var(--dim); letter-spacing:.02em; }
  header select#mode { font:inherit; font-size:12px; height:26px; padding:0 6px;
                       background:transparent; color:var(--dim);
                       border:1px solid transparent; border-radius:6px; cursor:pointer;
                       max-width:170px; }
  header select#mode:hover { border-color:var(--line); color:var(--fg); }
  /* Colour is reserved for a mode that has consequences. */
  header select#mode.hot  { border-color:var(--bad);  color:var(--bad);
                            background:var(--card); font-weight:600; }
  header select#mode.warm { border-color:var(--warn); color:var(--warn);
                            background:var(--card); font-weight:600; }

  header .chip { font:inherit; font-size:12px; height:26px; padding:0 9px;
                 display:inline-flex; align-items:center; gap:5px; cursor:pointer;
                 border:1px solid transparent; border-radius:6px;
                 background:transparent; color:var(--dim); white-space:nowrap; }
  header .chip:hover { border-color:var(--line); color:var(--fg); }
  header .chip::before { content:""; width:6px; height:6px; border-radius:50%;
                         background:var(--ok); flex-shrink:0; }
  /* Off is the state worth flagging: prompts silently stop carrying the tab. */
  header .chip.off { color:var(--dim); }
  header .chip.off::before { background:var(--dim); box-shadow:inset 0 0 0 1px var(--line); }

  header .meta { color:var(--dim); font-size:12px; margin-left:auto; min-width:0;
                 flex:0 1 auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* Tier 3 - settings. Set once, so they cost one click to reach and get real
     words when you get there, instead of an unlabelled arrow and a cog. */
  /* 14px keeps the bar to four type sizes; the glyph carries width, not size. */
  header .nav.icon { padding:0 10px; font-size:14px; letter-spacing:1px; color:var(--dim); }
  header .nav.icon:hover { color:var(--accent); }
  #moremenu { position:fixed; width:264px; background:var(--panel);
              border:1px solid var(--line); border-radius:8px; z-index:40;
              box-shadow:0 10px 30px rgba(0,0,0,.45); padding:5px; }
  #moremenu .mrow { display:flex; align-items:center; gap:8px; padding:6px 8px;
                    font-size:13px; color:var(--fg); }
  #moremenu .mrow .k { flex:1; color:var(--dim); }
  #moremenu .mitem { display:block; padding:7px 8px; font-size:13px; border-radius:5px;
                     color:var(--fg); text-decoration:none; cursor:pointer; }
  #moremenu .mitem:hover { background:var(--btn); color:var(--accent); }
  #moremenu .mdiv { height:1px; background:var(--line); margin:5px 4px; }
  #moremenu button { font:inherit; font-size:12px; height:26px; padding:0 10px;
                     border:1px solid var(--line); border-radius:6px;
                     background:var(--btn); color:var(--fg); cursor:pointer; }
  #moremenu button:hover { border-color:var(--accent); color:var(--accent); }
  #moremenu .seg { display:flex; }
  #moremenu .seg button { border-radius:0; padding:0 10px; }
  #moremenu .seg button:first-child { border-radius:6px 0 0 6px; }
  #moremenu .seg button:last-child  { border-radius:0 6px 6px 0; margin-left:-1px; }

  /* Narrow: shed what you can reconstruct by looking. No control is hidden -
     the settings menu already holds the rare ones, so nothing else may go. */
  @media (max-width:900px) {
    header { gap:8px; padding:0 10px; }
    header .brand strong { display:none; }
    header .meta { display:none; }
  }
  @media (max-width:680px) {
    header .sep { display:none; }
    header .status .lbl { display:none; }
  }

  #split { flex:1; display:flex; min-height:0; }
  .pane { display:flex; flex-direction:column; min-width:0; min-height:0; }
  #left  { flex:1 1 50%; }
  #right { flex:1 1 50%; border-left:1px solid var(--line); background:var(--code); }
  .pane-hd { padding:4px 10px; font-size:0.75rem; letter-spacing:.08em; text-transform:uppercase;
             color:var(--dim); border-bottom:1px solid var(--line); background:var(--panel); flex-shrink:0;
             display:flex; align-items:center; gap:8px; }
  .pane-hd .warn { color:var(--warn); text-transform:none; letter-spacing:0; margin-left:auto; font-size:0.917rem; }

  #grip { width:5px; cursor:col-resize; background:var(--line); flex-shrink:0; }
  #grip:hover { background:var(--accent); }

  #log { flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; padding:10px; display:flex; flex-direction:column; gap:6px; }
  .msg { white-space:pre-wrap; word-break:break-word; }
  /* Rendered markdown is real HTML: pre-wrap would turn every newline
     marked emits between block tags into a visible blank line. */
  .msg.md { white-space:normal; }
  .msg.md pre, .msg.md pre code { white-space:pre; }
  .user { color:var(--accent); border-left:2px solid var(--accent); padding-left:10px; }
  .ctx { color:var(--dim); font-size:0.792rem; border-left:2px solid var(--line);
         padding-left:10px; margin-top:-3px; overflow:hidden; text-overflow:ellipsis;
         white-space:nowrap; }
  button.off { opacity:.5; }

  /* rendered markdown (Claude's replies) */
  .md { white-space:normal; }
  .md > :first-child { margin-top:0; }
  .md > :last-child { margin-bottom:0; }
  .md p, .md ul, .md ol, .md pre, .md blockquote, .md table { margin:0 0 8px; }
  .md h1, .md h2, .md h3, .md h4 { margin:10px 0 6px; font-size:1.167rem; color:var(--fg); }
  .md h1 { font-size:1.333rem; } .md h2 { font-size:1.25rem; }
  .md ul, .md ol { padding-left:22px; }
  .md li { margin:2px 0; }
  .md code { overflow-wrap:anywhere; background:var(--inline); border:1px solid var(--line); border-radius:3px; padding:1px 5px; font-size:1.042rem; }
  .md pre { background:var(--code); border:1px solid var(--line); border-radius:5px; padding:9px 11px; overflow-x:auto; }
  .md pre code { background:none; border:0; padding:0; font-size:1.042rem; }
  .md blockquote { border-left:2px solid var(--dim); color:var(--dim); margin-left:0; padding-left:10px; }
  .md a { color:var(--accent); }
  .md hr { border:0; border-top:1px solid var(--line); margin:10px 0; }
  .md table { border-collapse:collapse; font-size:1.083rem; }
  .md th, .md td { border:1px solid var(--line); padding:3px 8px; text-align:left; }
  .md th { background:var(--panel); }
  .tool { color:var(--dim); font-size:0.833rem;
          white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tool b { color:var(--warn); font-weight:600; }
  .err  { color:var(--bad); }
  .end  { color:var(--dim); font-size:0.833rem; border-top:1px dashed var(--line); padding-top:5px; }
  /* An approval card is the one place the app asks you to stop and decide, so
     it is built like a dialogue, not like a bordered box: an accent rail
     instead of a hard 1px outline, room to breathe, and a command that wraps
     rather than hiding its tail behind a horizontal scrollbar. */
  .card { border:1px solid var(--line); border-left:3px solid var(--warn);
          border-radius:10px; padding:13px 15px; background:var(--card); }
  .card h4 { margin:0 0 9px; font-size:0.917rem; font-weight:600; color:var(--warn);
             letter-spacing:.01em; }
  .card pre { margin:0 0 12px; padding:10px 11px; background:var(--code);
              border:1px solid var(--line); border-radius:7px;
              max-height:200px; overflow-y:auto; overflow-x:hidden;
              white-space:pre-wrap; word-break:break-word; font-size:0.833rem; }
  .card .row { display:flex; flex-wrap:wrap; gap:7px; }
  /* A resolved card is history you still need to read — which tool you allowed,
     which option you chose. Dimming it with opacity stacked on top of the .4
     that disabled buttons already carry: .5 x .4 = .2, measured at 1.36:1
     against the background at 9.5px. That is not de-emphasised, it is
     unreadable. De-emphasise with colour, and keep the choice you made at full
     contrast, since it is the part worth going back for. */
  .card.done { opacity:1; border-color:var(--line); }
  .card.done h4 { color:var(--dim); }
  .card.done pre { color:var(--dim); }
  .card.done button:disabled { opacity:1; color:var(--dim); border-color:var(--line); }

  /* Claude asking you something — distinct from a permission prompt. */
  .q { border:1px solid var(--accent); border-radius:6px; padding:11px; background:var(--qcard); }
  .q.done { opacity:1; border-color:var(--line); }
  .q.done .chip { color:var(--dim); border-color:var(--line); }
  .q.done .opt:disabled { opacity:1; color:var(--dim); background:transparent; }
  .q.done .opt.sel:disabled { color:var(--fg); border-color:var(--accent); background:var(--sel); }
  .q .chip { display:inline-block; font-size:0.792rem; letter-spacing:.06em; text-transform:uppercase;
             color:var(--accent); border:1px solid var(--accent); border-radius:3px;
             padding:1px 5px; margin-bottom:6px; }
  .q .qt { margin:0 0 7px; font-size:0.917rem; color:var(--fg); }
  .q .opt { display:block; width:100%; text-align:left; margin:0 0 5px; padding:6px 9px;
            border:1px solid var(--line); background:var(--btn); border-radius:4px; cursor:pointer;
            color:var(--fg); font:inherit; }
  .q .opt:hover:not(:disabled) { border-color:var(--accent); }
  .q .opt.sel { border-color:var(--accent); background:var(--sel); }
  .q .opt .d { display:block; color:var(--dim); font-size:0.875rem; margin-top:2px; }
  .q .opt pre { margin:5px 0 0; padding:6px; background:var(--code); border-radius:3px;
                font-size:0.833rem; color:var(--dim); overflow:auto; max-height:150px; }
  .q .other { width:100%; box-sizing:border-box; background:#0f1115; color:var(--fg);
              border:1px solid var(--line); border-radius:4px; padding:5px 8px; font:inherit; font-size:0.917rem; margin-top:2px; }
  .q .send { margin-top:7px; border-color:var(--accent); color:var(--accent); }

  button { font:inherit; border:1px solid var(--line); background:var(--btn); color:var(--fg);
           padding:4px 11px; border-radius:6px; cursor:pointer;
           transition:background .12s, border-color .12s, color .12s; }
  button:hover:not(:disabled) { border-color:var(--accent); }
  button:disabled { opacity:.4; cursor:default; }

  /* Decision buttons carry weight in proportion to what they do: the expected
     action is filled, refusing is outlined and unmistakably red, and the
     standing grant that removes the gate for good stays quiet on purpose. */
  .card button, .q .send { font-size:0.917rem; line-height:1; height:30px;
                           padding:0 14px; border-radius:7px;
                           display:inline-flex; align-items:center; }
  .card button[data-decision="allow"] { background:var(--ok); border-color:var(--ok);
                                        color:var(--bg); font-weight:600; }
  .card button[data-decision="allow"]:hover:not(:disabled) { filter:brightness(1.08); }
  .card button[data-decision="deny"] { background:transparent; border-color:var(--bad); color:var(--bad); }
  .card button[data-decision="deny"]:hover:not(:disabled) { background:var(--bad); color:var(--bg); }
  /* "Always" is the only one of the three you cannot take back, so it does not
     get to look like the easy option. */
  .card button[data-decision="always"] { background:transparent; border-color:var(--line); color:var(--dim); }
  .card button[data-decision="always"]:hover:not(:disabled) { color:var(--fg); border-color:var(--dim); }

  footer { display:flex; flex-wrap:wrap; gap:8px; padding:10px 12px; border-top:1px solid var(--line);
           background:var(--panel); flex-shrink:0; }
  textarea { flex:1; resize:none; background:var(--bg); color:var(--fg); border:1px solid var(--line);
             border-radius:4px; padding:8px 10px; font:inherit; min-height:40px; max-height:160px; }
  textarea:focus { outline:none; border-color:var(--accent); }

  #menu { position:absolute; bottom:100%; left:12px; right:12px; margin-bottom:6px;
          background:var(--panel); border:1px solid var(--line); border-radius:6px;
          max-height:260px; overflow-y:auto; display:none; z-index:20;
          box-shadow:0 -6px 24px rgba(0,0,0,.45); }
  #menu.open { display:block; }
  #menu .item { padding:6px 11px; cursor:pointer; display:flex; gap:10px; align-items:baseline; }
  #menu .item.sel { background:var(--btn); }
  #menu .item .n { color:var(--accent); flex-shrink:0; }
  #menu .item .h { color:var(--warn); font-size:0.792rem; flex-shrink:0; }
  #menu .item .d { color:var(--dim); font-size:0.792rem; overflow:hidden;
                   text-overflow:ellipsis; white-space:nowrap; }
  footer { position:relative; }
  .local { color:var(--dim); background:var(--panel); border-left:2px solid var(--dim);
           padding:5px 8px; white-space:pre-wrap; font-size:0.833rem; border-radius:0 4px 4px 0; }

  /* Status bar: sits directly above the input, where you are already looking. */
  #status { position:relative; display:flex; align-items:center; gap:6px; padding:3px 11px; font-size:0.792rem;
            border-top:1px solid var(--line); background:var(--panel); color:var(--dim);
            flex-shrink:0; min-height:23px; }
  #status .pip { width:7px; height:7px; border-radius:50%; background:var(--line); flex-shrink:0; }
  #status.busy   .pip { background:var(--accent); animation:pulse 1.1s ease-in-out infinite; }
  #status.await  .pip { background:var(--warn);   animation:pulse .7s ease-in-out infinite; }
  #status.busy   { color:var(--accent); }
  #status.await  { color:var(--warn); }
  #status .t { margin-left:auto; font-variant-numeric:tabular-nums; opacity:.75; }
  @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.25 } }
  #status .jump { color:var(--warn); text-decoration:underline; cursor:pointer; }

  #status #promptsbtn { font-size:0.75rem; padding:0 6px; margin-right:2px; }
  #plist { position:absolute; bottom:100%; left:10px; right:10px; margin-bottom:6px;
           background:var(--panel); border:1px solid var(--line); border-radius:6px;
           max-height:320px; overflow-y:auto; display:none; z-index:40;
           box-shadow:0 -6px 22px rgba(0,0,0,.45); }
  #plist.open { display:block; }
  #plist .scope { padding:5px 10px; color:var(--dim); font-size:0.75rem;
                  border-bottom:1px solid var(--line); display:flex; gap:6px; align-items:center; }
  #plist .scope button { margin-left:auto; font-size:0.75rem; padding:1px 6px; }
  #plist .p { padding:6px 10px; cursor:pointer; display:flex; gap:8px; align-items:baseline; }
  #plist .p:hover { background:var(--btn); }
  #plist .p .t { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #plist .p .tag { color:var(--accent); font-size:0.708rem; flex-shrink:0; }
  #plist .p .act { color:var(--dim); flex-shrink:0; padding:0 3px; }
  #plist .p .act:hover { color:var(--fg); }
  #plist .edit { padding:8px 10px; border-top:1px solid var(--line); display:flex;
                 flex-direction:column; gap:5px; }
  #plist .edit input, #plist .edit textarea {
    background:var(--bg); color:var(--fg); border:1px solid var(--line);
    border-radius:4px; padding:4px 7px; font:inherit; font-size:0.833rem; }
  #plist .edit textarea { min-height:72px; resize:vertical; }
  #plist .edit .row { display:flex; gap:5px; }
  #plist .empty { padding:10px; color:var(--dim); font-size:0.833rem; }

  .pane-hd .tab { cursor:pointer; padding:1px 6px; border-radius:3px; }
  .pane-hd .tab.on { color:var(--fg); background:var(--btn); }
  .pane-hd .tab:hover:not(.on) { color:var(--fg); }

  #files { flex:1; min-height:0; display:flex; flex-direction:column; }
  .fbar { display:flex; align-items:center; gap:5px; padding:5px 8px; flex-shrink:0;
          border-bottom:1px solid var(--line); background:var(--panel); }
  .fbar button { font-size:0.833rem; padding:2px 7px; }
  .fpath { flex:1; color:var(--dim); font-size:0.833rem; overflow:hidden;
           text-overflow:ellipsis; white-space:nowrap; }
  .flist { flex:1; min-height:0; overflow:auto; }
  .flist .row { display:flex; align-items:center; gap:8px; padding:3px 9px; cursor:pointer; }
  .flist .row:hover { background:var(--btn); }
  .flist .row .n { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .flist .row.dir .n { color:var(--accent); }

<script>
/* Web implementation of the PLATFORM shim — see extension/platform.js. This
   page is served by the server it talks to, so every URL is this origin. The
   transcript, chats, files, prompts and settings below are sidepanel.js — the
   same file the Chrome side panel and the mobile page run — served as
   /m/app.js. desktop.js adds only the terminal pane and the split. */
globalThis.PLATFORM = {
  name: "desktop",
  async wsUrl() { return `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`; },
  async httpBase() { return location.origin; },
  /* No extension here; the server routes browser tools to whichever browser
     has the extension connected — usually the one this tab is in. */
  async instanceId() { return null; },
  openUrl(url) { location.href = url; },
  tabLabel(on) { return on ? "tab: on" : "tab: off"; },
  tabTitle: "Attach the active browser tab to each prompt",
  async takePendingPrompt() { return null; },
  onPendingPrompt() {},
  // showFiles is installed by desktop.js: files live in the right pane here.
};
</script>
