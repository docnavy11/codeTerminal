<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>code terminal</title>
<link rel="stylesheet" href="/vendor/xterm/css/xterm.css">
<style>
  /* Base type size — the A−/A+ buttons rewrite this, so every rem follows. */
  html { font-size: 12px; }   /* default; A−/A+ override per browser */

  :root {
    --bg:#14171e; --panel:#1a1e27; --line:#2b3140; --fg:#dfe3ec; --dim:#8b93a7;
    --accent:#7aa2f7; --ok:#7dcfa0; --warn:#e0af68; --bad:#f07178;
    --code:#0f1219; --card:#211e18; --qcard:#181d2b; --btn:#252a36; --sel:#2a3550; --inline:#222739;
    --mono: ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    color-scheme: dark;
  }

  /* Light palette. Applied when the OS asks for it and you have not overridden,
     and again when you pick light explicitly, so the toggle wins both ways. */
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg:#fbfbfd; --panel:#f1f2f6; --line:#d9dce4; --fg:#1c1f26; --dim:#666d7d;
      --accent:#2f5fd0; --ok:#1f7a4d; --warn:#8a6100; --bad:#c0392b;
      --code:#f4f5f8; --card:#fdf6e6; --qcard:#eef3fd; --btn:#e6e8ee; --sel:#cfdcf7; --inline:#eceef4;
      color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --bg:#fbfbfd; --panel:#f1f2f6; --line:#d9dce4; --fg:#1c1f26; --dim:#666d7d;
    --accent:#2f5fd0; --ok:#1f7a4d; --warn:#8a6100; --bad:#c0392b;
    --code:#f4f5f8; --card:#fdf6e6; --qcard:#eef3fd; --btn:#e6e8ee; --sel:#cfdcf7; --inline:#eceef4;
    color-scheme: light;
  }
  * { box-sizing:border-box; }
  /* The UA's [hidden] rule is display:none at the weakest specificity, so any
     element with its own display (flex here) ignores it. Every toggle in this
     file uses .hidden, so make it win. */
  [hidden] { display:none !important; }
  html,body { margin:0; height:100%; overflow:hidden; }
  body { display:flex; flex-direction:column; background:var(--bg); color:var(--fg);
         font:1rem/1.45 var(--mono); }

  header { display:flex; align-items:center; gap:10px; padding:9px 14px;
           border-bottom:1px solid var(--line); background:var(--panel); flex-shrink:0; }
  header .dot { width:8px; height:8px; border-radius:50%; background:var(--bad); }
  header .dot.on { background:var(--ok); }
  header .meta { color:var(--dim); font-size:0.833rem; margin-left:auto; }
  header select { font:inherit; font-size:0.833rem; background:var(--btn); color:var(--fg);
                  border:1px solid var(--line); border-radius:4px; padding:3px 6px; }
  header select.hot { border-color:var(--bad); color:var(--bad); }
  header select.warm { border-color:var(--warn); color:var(--warn); }
  button.small { font-size:0.833rem; padding:2px 7px; }

  #split { flex:1; display:flex; min-height:0; }
  .pane { display:flex; flex-direction:column; min-width:0; min-height:0; }
  #left  { flex:1 1 50%; }
  #right { flex:1 1 50%; border-left:1px solid var(--line); background:var(--code); }
  .pane-hd { padding:4px 10px; font-size:0.75rem; letter-spacing:.08em; text-transform:uppercase;
             color:var(--dim); border-bottom:1px solid var(--line); background:var(--panel); flex-shrink:0;
             display:flex; align-items:center; gap:8px; }
  .pane-hd .warn { color:var(--warn); text-transform:none; letter-spacing:0; margin-left:auto; font-size:0.917rem; }

  #grip { width:5px; cursor:col-resize; background:var(--line); flex-shrink:0; }
  #grip:hover { background:var(--accent); }

  #log { flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; padding:10px; display:flex; flex-direction:column; gap:6px; }
  .msg { white-space:pre-wrap; word-break:break-word; }
  /* Rendered markdown is real HTML: pre-wrap would turn every newline
     marked emits between block tags into a visible blank line. */
  .msg.md { white-space:normal; }
  .msg.md pre, .msg.md pre code { white-space:pre; }
  .user { color:var(--accent); border-left:2px solid var(--accent); padding-left:10px; }
  .ctx { color:var(--dim); font-size:0.792rem; border-left:2px solid var(--line);
         padding-left:10px; margin-top:-3px; overflow:hidden; text-overflow:ellipsis;
         white-space:nowrap; }
  button.off { opacity:.5; }

  /* rendered markdown (Claude's replies) */
  .md { white-space:normal; }
  .md > :first-child { margin-top:0; }
  .md > :last-child { margin-bottom:0; }
  .md p, .md ul, .md ol, .md pre, .md blockquote, .md table { margin:0 0 8px; }
  .md h1, .md h2, .md h3, .md h4 { margin:10px 0 6px; font-size:1.167rem; color:var(--fg); }
  .md h1 { font-size:1.333rem; } .md h2 { font-size:1.25rem; }
  .md ul, .md ol { padding-left:22px; }
  .md li { margin:2px 0; }
  .md code { overflow-wrap:anywhere; background:var(--inline); border:1px solid var(--line); border-radius:3px; padding:1px 5px; font-size:1.042rem; }
  .md pre { background:var(--code); border:1px solid var(--line); border-radius:5px; padding:9px 11px; overflow-x:auto; }
  .md pre code { background:none; border:0; padding:0; font-size:1.042rem; }
  .md blockquote { border-left:2px solid var(--dim); color:var(--dim); margin-left:0; padding-left:10px; }
  .md a { color:var(--accent); }
  .md hr { border:0; border-top:1px solid var(--line); margin:10px 0; }
  .md table { border-collapse:collapse; font-size:1.083rem; }
  .md th, .md td { border:1px solid var(--line); padding:3px 8px; text-align:left; }
  .md th { background:var(--panel); }
  .tool { color:var(--dim); font-size:0.833rem;
          white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tool b { color:var(--warn); font-weight:600; }
  .err  { color:var(--bad); }
  .end  { color:var(--dim); font-size:0.833rem; border-top:1px dashed var(--line); padding-top:5px; }
  .card { border:1px solid var(--warn); border-radius:6px; padding:11px; background:var(--card); }
  .card h4 { margin:0 0 5px; font-size:0.875rem; color:var(--warn); }
  .card pre { margin:0 0 9px; padding:8px; background:var(--code); border-radius:4px;
              max-height:180px; overflow:auto; font-size:0.833rem; }
  .card.done { opacity:.45; border-color:var(--line); }

  /* Claude asking you something — distinct from a permission prompt. */
  .q { border:1px solid var(--accent); border-radius:6px; padding:11px; background:var(--qcard); }
  .q.done { opacity:.5; border-color:var(--line); }
  .q .chip { display:inline-block; font-size:0.792rem; letter-spacing:.06em; text-transform:uppercase;
             color:var(--accent); border:1px solid var(--accent); border-radius:3px;
             padding:1px 5px; margin-bottom:6px; }
  .q .qt { margin:0 0 7px; font-size:0.917rem; color:var(--fg); }
  .q .opt { display:block; width:100%; text-align:left; margin:0 0 5px; padding:6px 9px;
            border:1px solid var(--line); background:var(--btn); border-radius:4px; cursor:pointer;
            color:var(--fg); font:inherit; }
  .q .opt:hover:not(:disabled) { border-color:var(--accent); }
  .q .opt.sel { border-color:var(--accent); background:var(--sel); }
  .q .opt .d { display:block; color:var(--dim); font-size:0.792rem; margin-top:2px; }
  .q .opt pre { margin:5px 0 0; padding:6px; background:var(--code); border-radius:3px;
                font-size:0.833rem; color:var(--dim); overflow:auto; max-height:150px; }
  .q .other { width:100%; box-sizing:border-box; background:#0f1115; color:var(--fg);
              border:1px solid var(--line); border-radius:4px; padding:5px 8px; font:inherit; font-size:0.917rem; margin-top:2px; }
  .q .send { margin-top:7px; border-color:var(--accent); color:var(--accent); }

  button { font:inherit; border:1px solid var(--line); background:var(--btn); color:var(--fg);
           padding:3px 10px; border-radius:4px; cursor:pointer; }
  button:hover:not(:disabled) { border-color:var(--accent); }
  button:disabled { opacity:.4; cursor:default; }
  button.allow { border-color:var(--ok); color:var(--ok); }
  button.deny  { border-color:var(--bad); color:var(--bad); }

  footer { display:flex; gap:8px; padding:10px 12px; border-top:1px solid var(--line);
           background:var(--panel); flex-shrink:0; }
  textarea { flex:1; resize:none; background:var(--bg); color:var(--fg); border:1px solid var(--line);
             border-radius:4px; padding:8px 10px; font:inherit; min-height:40px; max-height:160px; }
  textarea:focus { outline:none; border-color:var(--accent); }

  #chatlist { position:absolute; top:30px; width:400px; max-height:340px;
              overflow-y:auto; background:var(--panel); border:1px solid var(--line);
              border-radius:6px; display:none; z-index:30; box-shadow:0 8px 28px rgba(0,0,0,.5); }
  #chatlist.open { display:block; }
  #chatlist .row { padding:6px 10px; cursor:pointer; display:flex; gap:8px; align-items:baseline; }
  #chatlist .row:hover { background:var(--btn); }
  #chatlist .row.active { border-left:2px solid var(--accent); }
  #chatlist .row .t { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #chatlist .row .w { color:var(--dim); font-size:0.75rem; flex-shrink:0; }
  #chatlist .row .x { color:var(--dim); flex-shrink:0; padding:0 3px; }
  #chatlist .row .x:hover { color:var(--bad); }
  #chatlist .empty { padding:9px; color:var(--dim); font-size:0.833rem; }

  #menu { position:absolute; bottom:100%; left:12px; right:12px; margin-bottom:6px;
          background:var(--panel); border:1px solid var(--line); border-radius:6px;
          max-height:260px; overflow-y:auto; display:none; z-index:20;
          box-shadow:0 -6px 24px rgba(0,0,0,.45); }
  #menu.open { display:block; }
  #menu .item { padding:6px 11px; cursor:pointer; display:flex; gap:10px; align-items:baseline; }
  #menu .item.sel { background:var(--btn); }
  #menu .item .n { color:var(--accent); flex-shrink:0; }
  #menu .item .h { color:var(--warn); font-size:0.792rem; flex-shrink:0; }
  #menu .item .d { color:var(--dim); font-size:0.792rem; overflow:hidden;
                   text-overflow:ellipsis; white-space:nowrap; }
  footer { position:relative; }
  .local { color:var(--dim); background:var(--panel); border-left:2px solid var(--dim);
           padding:5px 8px; white-space:pre-wrap; font-size:0.833rem; border-radius:0 4px 4px 0; }

  /* Status bar: sits directly above the input, where you are already looking. */
  #status { position:relative; display:flex; align-items:center; gap:6px; padding:3px 11px; font-size:0.792rem;
            border-top:1px solid var(--line); background:var(--panel); color:var(--dim);
            flex-shrink:0; min-height:23px; }
  #status .pip { width:7px; height:7px; border-radius:50%; background:var(--line); flex-shrink:0; }
  #status.busy   .pip { background:var(--accent); animation:pulse 1.1s ease-in-out infinite; }
  #status.await  .pip { background:var(--warn);   animation:pulse .7s ease-in-out infinite; }
  #status.busy   { color:var(--accent); }
  #status.await  { color:var(--warn); }
  #status .t { margin-left:auto; font-variant-numeric:tabular-nums; opacity:.75; }
  @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.25 } }
  #status .jump { color:var(--warn); text-decoration:underline; cursor:pointer; }

  #status #prompts { font-size:0.75rem; padding:0 6px; margin-right:2px; }
  #plist { position:absolute; bottom:100%; left:10px; right:10px; margin-bottom:6px;
           background:var(--panel); border:1px solid var(--line); border-radius:6px;
           max-height:320px; overflow-y:auto; display:none; z-index:40;
           box-shadow:0 -6px 22px rgba(0,0,0,.45); }
  #plist.open { display:block; }
  #plist .scope { padding:5px 10px; color:var(--dim); font-size:0.75rem;
                  border-bottom:1px solid var(--line); display:flex; gap:6px; align-items:center; }
  #plist .scope button { margin-left:auto; font-size:0.75rem; padding:1px 6px; }
  #plist .p { padding:6px 10px; cursor:pointer; display:flex; gap:8px; align-items:baseline; }
  #plist .p:hover { background:var(--btn); }
  #plist .p .t { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #plist .p .tag { color:var(--accent); font-size:0.708rem; flex-shrink:0; }
  #plist .p .act { color:var(--dim); flex-shrink:0; padding:0 3px; }
  #plist .p .act:hover { color:var(--fg); }
  #plist .edit { padding:8px 10px; border-top:1px solid var(--line); display:flex;
                 flex-direction:column; gap:5px; }
  #plist .edit input, #plist .edit textarea {
    background:var(--bg); color:var(--fg); border:1px solid var(--line);
    border-radius:4px; padding:4px 7px; font:inherit; font-size:0.833rem; }
  #plist .edit textarea { min-height:72px; resize:vertical; }
  #plist .edit .row { display:flex; gap:5px; }
  #plist .empty { padding:10px; color:var(--dim); font-size:0.833rem; }

  .pane-hd .tab { cursor:pointer; padding:1px 6px; border-radius:3px; }
  .pane-hd .tab.on { color:var(--fg); background:var(--btn); }
  .pane-hd .tab:hover:not(.on) { color:var(--fg); }

  #files { flex:1; min-height:0; display:flex; flex-direction:column; }
  .fbar { display:flex; align-items:center; gap:5px; padding:5px 8px; flex-shrink:0;
          border-bottom:1px solid var(--line); background:var(--panel); }
  .fbar button { font-size:0.833rem; padding:2px 7px; }
  .fpath { flex:1; color:var(--dim); font-size:0.833rem; overflow:hidden;
           text-overflow:ellipsis; white-space:nowrap; }
  .flist { flex:1; min-height:0; overflow:auto; }
  .flist .row { display:flex; align-items:center; gap:8px; padding:3px 9px; cursor:pointer; }
  .flist .row:hover { background:var(--btn); }
  .flist .row .n { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .flist .row.dir .n { color:var(--accent); }
  .flist .row .s { color:var(--dim); font-size:0.792rem; flex-shrink:0;
                   font-variant-numeric:tabular-nums; }
  .flist .row .dl { color:var(--dim); flex-shrink:0; padding:0 3px; }
  .flist .row .dl:hover { color:var(--ok); }
  .flist.drop { outline:2px dashed var(--accent); outline-offset:-4px; }
  .fview { flex:1; min-height:0; overflow:auto; padding:9px; }
  .fview pre { margin:0; white-space:pre-wrap; word-break:break-word; font-size:0.833rem; }
  .fview img { max-width:100%; }
  .fview .hd { display:flex; gap:8px; align-items:center; margin-bottom:7px; color:var(--dim); }

  #term { flex:1; min-height:0; padding:6px 0 0 8px; }
  .xterm-viewport::-webkit-scrollbar { width:9px; }
  .xterm-viewport::-webkit-scrollbar-thumb { background:var(--line); border-radius:5px; }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span><strong>code terminal</strong>
  <select id="mode" title="How much you want to be asked">
    <option value="default">Ask before changes</option>
    <option value="acceptEdits">Auto-accept edits</option>
    <option value="auto">Classifier decides</option>
    <option value="plan">Plan only (no changes)</option>
    <option value="bypassPermissions">Never ask</option>
  </select>
  <button id="tabctx" class="small" title="Attach the active browser tab to each prompt">tab: on</button>
  <button id="theme" class="small" title="Theme: auto / light / dark">auto</button>
  <button id="fsdown" class="small" title="Smaller text">A−</button>
  <button id="fsup" class="small" title="Larger text">A+</button>
  <button id="chats" class="small">Chats ▾</button>
  <button id="reset" class="small">New chat</button>
  <div id="chatlist"></div>
  <span class="meta" id="meta">connecting…</span>
</header>

<div id="split">
  <div class="pane" id="left">
    <div class="pane-hd">claude</div>
    <div id="log"></div>
    <div id="status"><div id="plist"></div><button id="prompts" title="Prepared prompts">prompts</button><span class="pip"></span><span id="statustext">ready</span><span class="t" id="statustime"></span></div>
    <footer>
      <div id="menu"></div>
      <textarea id="box" placeholder="Ask Claude…  (Enter to send, Shift+Enter newline)" autofocus></textarea>
      <button id="stop" disabled>Stop</button>
    </footer>
  </div>

  <div id="grip"></div>

  <div class="pane" id="right">
    <div class="pane-hd">
      <span class="tab on" data-tab="shell">shell</span>
      <span class="tab" data-tab="files">files</span>
      <span class="warn" id="rightnote">no approval gate</span>
    </div>
    <div id="term"></div>
    <div id="files" hidden>
      <div class="fbar">
        <button id="fup" title="Up one level">↑</button>
        <span id="fpath" class="fpath">/</span>
        <button id="frefresh" title="Refresh">⟳</button>
        <button id="fcwd" title="Make this the working directory for this chat">use here</button>
        <button id="fupload">Upload</button>
        <input type="file" id="fpick" multiple hidden>
      </div>
      <div id="flist" class="flist"></div>
      <div id="fview" class="fview" hidden></div>
    </div>
  </div>
</div>

<script src="/vendor/xterm/lib/xterm.js"></script>
<script src="/vendor/addon-fit/lib/addon-fit.js"></script>
<script src="/vendor/addon-web-links/lib/addon-web-links.js"></script>
<script src="/vendor/marked/marked.umd.js"></script>
<script src="/vendor/dompurify/purify.min.js"></script>
<script>
// No token: the server authenticates the connection itself, by Origin plus
// `tailscale whois` on the peer address.
const wsBase = `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}`;
const url = (path) => `${wsBase}${path}`;

/* ---------------- claude pane ---------------- */
const log = document.getElementById("log");
const modeSel = document.getElementById("mode");

/* ---- appearance: type size and theme, both remembered per browser ------- */
const MIN_FS = 9, MAX_FS = 20;
let fontSize = clampFs(parseFloat(localStorage.getItem("ct.fs")) || 12);
let theme = localStorage.getItem("ct.theme") || "auto";   // auto | light | dark

function clampFs(n) { return Math.min(MAX_FS, Math.max(MIN_FS, n)); }

function applyFontSize() {
  document.documentElement.style.fontSize = fontSize + "px";
  localStorage.setItem("ct.fs", String(fontSize));
  // The terminal is a canvas, so it needs telling separately.
  if (typeof term !== "undefined" && term) {
    term.options.fontSize = Math.max(8, Math.round(fontSize - 1));
    try { fit.fit(); sendResize(); } catch {}
  }
}

function applyTheme() {
  if (theme === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", theme);
  localStorage.setItem("ct.theme", theme);
  document.getElementById("theme").textContent = theme;
  document.getElementById("theme").title = `Theme: ${theme} (click to change)`;
  applyTermTheme();
}

/** xterm paints on a canvas and cannot read CSS variables, so hand them over. */
function applyTermTheme() {
  if (typeof term === "undefined" || !term) return;
  const v = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  term.options.theme = {
    background: v("--code"), foreground: v("--fg"), cursor: v("--accent"),
    selectionBackground: v("--sel"),
    black: v("--line"), red: v("--bad"), green: v("--ok"), yellow: v("--warn"),
    blue: v("--accent"), magenta: "#bb9af7", cyan: "#7dcfe0", white: v("--fg"),
  };
}

/* Every prompt otherwise ships the current URL, so make it visible and optional. */
let withTab = localStorage.getItem("ct.tab") !== "0";
const tabBtn = document.getElementById("tabctx");
function paintTab() {
  tabBtn.textContent = withTab ? "tab: on" : "tab: off";
  tabBtn.classList.toggle("off", !withTab);
  localStorage.setItem("ct.tab", withTab ? "1" : "0");
}
tabBtn.onclick = () => { withTab = !withTab; paintTab(); };
paintTab();

document.getElementById("fsup").onclick   = () => { fontSize = clampFs(fontSize + 1); applyFontSize(); };
document.getElementById("fsdown").onclick = () => { fontSize = clampFs(fontSize - 1); applyFontSize(); };
document.getElementById("theme").onclick  = () => {
  theme = { auto: "light", light: "dark", dark: "auto" }[theme];
  applyTheme();
};
// Follow the OS while on auto.
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (theme === "auto") applyTermTheme(); });
const box = document.getElementById("box");
const dot = document.getElementById("dot");
const meta = document.getElementById("meta");
const stop = document.getElementById("stop");
let agentWs, busy = false, lastText = null, lastRaw = "", cost = 0;

/* Markdown → sanitized DOM. Model output lands in a page that holds an open
   shell socket, so it is never trusted: DOMPurify strips scripts/handlers and
   links are forced to open in a new tab without a referrer. */
marked.use({ gfm: true, breaks: true });
DOMPurify.addHook("afterSanitizeAttributes", (node) => {
  if (node.tagName === "A") { node.setAttribute("target", "_blank"); node.setAttribute("rel", "noopener noreferrer"); }
});
function renderMd(target, raw) {
  target.innerHTML = DOMPurify.sanitize(marked.parse(raw), { USE_PROFILES: { html: true } });
}

function el(cls, text) {
  const d = document.createElement("div");
  d.className = cls;
  if (text !== undefined) d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}
const setBusy = (v) => { busy = v; stop.disabled = !v; };

/* ---- status bar ---------------------------------------------------------
   The server sends the state; the clock is client-side, started when the
   message lands, so a skewed clock between machines cannot show "-3s". */
const statusEl = document.getElementById("status");
const statusText = document.getElementById("statustext");
const statusTime = document.getElementById("statustime");
let statusSince = 0, statusTick = null, statusState = "idle";

function applyStatus(m) {
  const changed = m.state !== statusState || m.detail !== (statusEl.dataset.detail ?? "");
  statusState = m.state;
  statusEl.dataset.detail = m.detail ?? "";
  if (changed) statusSince = Date.now();

  statusEl.classList.toggle("busy",  m.state === "thinking" || m.state === "tool" || m.state === "compacting");
  statusEl.classList.toggle("await", m.state === "awaiting");

  statusText.replaceChildren();
  const label = {
    idle:       "ready",
    thinking:   m.tokens > 0 ? `thinking · ${fmtTokens(m.tokens)} tokens` : "thinking",
    tool:       `running ${m.detail}`,
    compacting: "compacting the conversation",
    awaiting:   `waiting for you — ${m.detail}`,
  }[m.state] ?? m.state;
  statusText.append(document.createTextNode(label));

  if (m.state === "awaiting") {
    const a = document.createElement("span");
    a.className = "jump"; a.textContent = "jump to it";
    a.style.marginLeft = "8px";
    a.onclick = () => document.querySelector(".card:not(.done)")?.scrollIntoView({ behavior: "smooth", block: "center" });
    statusText.append(a);
  }

  // The turn is still live while an approval is open, so the server will
  // reject a new prompt then too — block sending, but keep Stop available
  // so you can abandon the turn instead of answering the card.
  setBusy(m.state !== "idle");
  stop.disabled = m.state === "idle";
  box.placeholder =
    m.state === "idle"     ? "Ask Claude…  (Enter to send, Shift+Enter newline)"
  : m.state === "awaiting" ? (m.detail === "a question"
      ? "Answer the question above to continue — or press Stop"
      : "Approve or deny above to continue — or press Stop")
  : "Claude is working — press Stop to interrupt";

  clearInterval(statusTick);
  statusTick = null;
  statusTime.textContent = "";
  if (m.state !== "idle") {
    const tick = () => {
      const s = Math.floor((Date.now() - statusSince) / 1000);
      statusTime.textContent = s < 60 ? `${s}s` : `${Math.floor(s / 60)}m ${s % 60}s`;
    };
    tick();
    statusTick = setInterval(tick, 1000);
  }
}

function fmtTokens(n) { return n >= 1000 ? `${(n / 1000).toFixed(1)}k` : String(n); }

function connectAgent() {
  agentWs = new WebSocket(url("/ws"));
  agentWs.onopen  = () => { dot.classList.add("on"); meta.textContent = "connected"; };
  agentWs.onclose = (e) => {
    dot.classList.remove("on");
    meta.textContent = e.code === 1006 ? "rejected — not a recognised tailnet peer" : "disconnected";
    setBusy(false);
  };
  agentWs.onmessage = ({ data }) => {
    const m = JSON.parse(data);
    switch (m.kind) {
      case "cwd": {
        cwdShown = m.path;
        meta.textContent = modelShown ? `${modelShown} · ${cwdShown}` : cwdShown;
        break;
      }
      case "ready": {
        modelShown = m.model;
        meta.textContent = `${m.model} · ${cwdShown || m.workspace}`;
        const opt = modeSel.querySelector('option[value="bypassPermissions"]');
        opt.disabled = !m.canBypass;
        opt.textContent = m.canBypass ? "Never ask" : "Never ask (set CODETERM_ALLOW_BYPASS=1)";
        break;
      }
      case "user": {
        el("msg user", m.text);
        if (m.context) {
          const c = el("ctx", "⌁ " + m.context.split("\n")[0]);
          c.title = m.context;
        }
        lastText = null;
        break;
      }
      case "local": el("local", m.text); lastText = null; break;
      case "watch": el("local", `⌁ watch fired — ${m.description}: ${m.detail}`); lastText = null; break;
      case "commands": COMMANDS = m.commands; break;
      case "cleared": log.replaceChildren(); cost = 0; lastText = null; streaming = null; break;
      case "replayed": lastText = null; break;
      case "status": applyStatus(m); break;
      case "chats": CHATS = m.chats; ACTIVE = m.activeId; renderChats(); break;
      case "mode":
        document.getElementById("mode").value = m.mode;
        modeSel.classList.toggle("hot", m.mode === "bypassPermissions");
        modeSel.classList.toggle("warm", m.mode === "auto" || m.mode === "acceptEdits");
        break;
      // Streaming text as it is generated. The completed "text" event below
      // replaces this with the authoritative copy, so a dropped delta cannot
      // leave the reply subtly wrong.
      case "delta":
        if (!streaming) { streaming = el("msg md"); streamRaw = ""; }
        streamRaw += m.text;
        renderMd(streaming, streamRaw);
        log.scrollTop = log.scrollHeight;
        break;

      case "text":
        // Text arrives in blocks; keep the raw markdown and re-render the whole
        // message so constructs spanning blocks (lists, fences) stay intact.
        if (streaming) { lastText = streaming; lastRaw = m.text; streaming = null; streamRaw = ""; }
        else if (lastText) lastRaw += "\n" + m.text;
        else { lastText = el("msg md"); lastRaw = m.text; }
        renderMd(lastText, lastRaw);
        log.scrollTop = log.scrollHeight;
        break;
      case "tool": {
        if (m.name === "AskUserQuestion") { lastText = null; streaming = null; break; }  // the card says it better
        const d = el("tool");
        d.innerHTML = "→ <b></b> ";
        d.querySelector("b").textContent = m.name;
        d.append(summarize(m.input));
        lastText = null;
        break;
      }
      case "approval": renderApproval(m); break;
      case "question": renderQuestion(m); break;
      case "approval_closed": {
        const c = document.querySelector(`[data-approval="${m.id}"]`);
        if (c) {
          c.classList.add("done");
          c.querySelectorAll("button").forEach(b => b.disabled = true);
          const label = { allow:"Approved", always:"Always allowed", deny:"Denied", gone:"Expired" }[m.decision] ?? "Closed";
          c.querySelector("h4").textContent = `${label} ${c.dataset.tool}`;
        }
        break;
      }
      case "turn_end":
        if (typeof m.costUsd === "number") cost += m.costUsd;
        el("end", `done${m.denials ? ` · ${m.denials} denied` : ""} · est. $${cost.toFixed(4)} (list price; not billed on a subscription)`);
        lastText = null; streaming = null; streamRaw = "";
        break;
      case "error": el("msg err", m.message); streaming = null; break;
    }
  };
}

function summarize(input) {
  if (!input || typeof input !== "object") return "";
  if (typeof input.command === "string") return input.command;
  if (typeof input.file_path === "string") return input.file_path;
  return JSON.stringify(input).slice(0, 160);
}

/**
 * Claude asking the user something. The answer goes back keyed by the exact
 * question text — that is the contract AskUserQuestion's `answers` expects.
 */
function renderQuestion(m) {
  const card = el("q");
  card.dataset.approval = m.id;
  card.dataset.tool = "question";
  const picked = new Map();   // question text -> Set of labels

  for (const q of m.questions) {
    picked.set(q.question, new Set());

    const chip = document.createElement("span");
    chip.className = "chip"; chip.textContent = q.header || "question";
    const title = document.createElement("p");
    title.className = "qt"; title.textContent = q.question;
    card.append(chip, title);

    const opts = [...q.options, { label: "Other", description: "Type your own answer", other: true }];
    for (const o of opts) {
      const b = document.createElement("button");
      b.className = "opt"; b.type = "button";
      b.append(document.createTextNode(o.label));
      if (o.description) {
        const d = document.createElement("span"); d.className = "d"; d.textContent = o.description;
        b.append(d);
      }
      if (o.preview) {
        const pre = document.createElement("pre"); pre.textContent = o.preview;
        b.append(pre);
      }

      let otherBox = null;
      b.onclick = () => {
        const set = picked.get(q.question);
        if (!q.multiSelect) {
          set.clear();
          card.querySelectorAll(`[data-q="${CSS.escape(q.question)}"]`).forEach(x => x.classList.remove("sel"));
        }
        if (o.other) {
          if (!otherBox) {
            otherBox = document.createElement("input");
            otherBox.className = "other"; otherBox.placeholder = "your answer…";
            otherBox.oninput = () => {
              set.forEach(v => { if (v.startsWith("\u0000other:")) set.delete(v); });
              if (otherBox.value.trim()) set.add("\u0000other:" + otherBox.value.trim());
            };
            b.after(otherBox);
          }
          otherBox.focus();
        }
        b.classList.toggle("sel");
        if (b.classList.contains("sel")) { if (!o.other) set.add(o.label); }
        else { set.delete(o.label); if (otherBox) { otherBox.remove(); otherBox = null; } }
      };
      b.dataset.q = q.question;
      card.append(b);
    }
  }

  const send = document.createElement("button");
  send.className = "send"; send.textContent = "Answer";
  send.onclick = () => {
    const answers = {};
    for (const [question, set] of picked) {
      const vals = [...set].map(v => v.startsWith("\u0000other:") ? v.slice(7) : v);
      if (vals.length) answers[question] = vals.join(", ");
    }
    if (!Object.keys(answers).length) return;   // nothing chosen yet
    agentWs.send(JSON.stringify({ type: "answer", id: m.id, answers }));
    card.querySelectorAll("button,input").forEach(x => x.disabled = true);
    card.classList.add("done");
  };
  card.append(send);
  log.scrollTop = log.scrollHeight;
}

function renderApproval(m) {
  const card = el("card");
  card.dataset.approval = m.id;
  card.dataset.tool = m.tool;
  const h = document.createElement("h4");
  h.textContent = `Approve ${m.tool}?`;
  const pre = document.createElement("pre");
  pre.textContent = typeof m.input?.command === "string" ? m.input.command : JSON.stringify(m.input, null, 2);

  const row = document.createElement("div");
  const choices = [["Approve", "allow", "allow"], ["Deny", "deny", "deny"]];
  // "Always" only when the SDK actually offered a rule for this call.
  if (m.canAlways) choices.splice(1, 0, [`Always allow ${m.tool}`, "always", "allow"]);

  for (const [label, decision, cls] of choices) {
    const b = document.createElement("button");
    b.textContent = label; b.className = cls;
    b.onclick = () => {
      agentWs.send(JSON.stringify({ type: "decision", id: m.id, decision }));
      card.querySelectorAll("button").forEach(x => x.disabled = true);
    };
    row.append(b, document.createTextNode(" "));
  }
  card.append(h, pre, row);
  log.scrollTop = log.scrollHeight;
}

let COMMANDS = [];
const menu = document.getElementById("menu");
let matches = [], sel = 0;

/** The menu opens only while the whole box is a single "/word" being typed. */
function currentQuery() {
  const v = box.value;
  if (!v.startsWith("/") || /\s/.test(v)) return null;
  return v.slice(1).toLowerCase();
}

function refreshMenu() {
  const q = currentQuery();
  if (q === null) { menu.classList.remove("open"); matches = []; return; }
  matches = COMMANDS
    .filter(c => c.name.toLowerCase().startsWith(q) ||
                 (c.aliases ?? []).some(a => a.toLowerCase().startsWith(q)))
    .slice(0, 60);
  if (!matches.length) { menu.classList.remove("open"); return; }
  sel = Math.min(sel, matches.length - 1);
  menu.replaceChildren(...matches.map((c, i) => {
    const d = document.createElement("div");
    d.className = "item" + (i === sel ? " sel" : "");
    const n = document.createElement("span"); n.className = "n"; n.textContent = "/" + c.name;
    d.appendChild(n);
    if (c.argumentHint) { const h = document.createElement("span"); h.className = "h"; h.textContent = c.argumentHint; d.appendChild(h); }
    const de = document.createElement("span"); de.className = "d"; de.textContent = c.description || "";
    d.appendChild(de);
    d.onmousedown = (e) => { e.preventDefault(); pick(i); };
    return d;
  }));
  menu.classList.add("open");
  menu.querySelector(".sel")?.scrollIntoView({ block: "nearest" });
}

function pick(i) {
  const c = matches[i];
  if (!c) return;
  box.value = "/" + c.name + (c.argumentHint ? " " : "");
  menu.classList.remove("open");
  matches = [];
  box.focus();
  if (!c.argumentHint) send();
}

function send() {
  const text = box.value.trim();
  if (!text || busy || agentWs?.readyState !== WebSocket.OPEN) return;
  agentWs.send(JSON.stringify({ type: "prompt", text, withTab }));
  box.value = ""; box.style.height = "auto";
  menu.classList.remove("open"); matches = [];
  lastText = null;
  setBusy(true);
}

box.addEventListener("keydown", (e) => {
  if (menu.classList.contains("open") && matches.length) {
    if (e.key === "ArrowDown") { e.preventDefault(); sel = (sel + 1) % matches.length; refreshMenu(); return; }
    if (e.key === "ArrowUp")   { e.preventDefault(); sel = (sel - 1 + matches.length) % matches.length; refreshMenu(); return; }
    if (e.key === "Tab" || (e.key === "Enter" && !e.shiftKey)) { e.preventDefault(); pick(sel); return; }
    if (e.key === "Escape")    { menu.classList.remove("open"); matches = []; return; }
  }
  if (e.key !== "Enter" || e.shiftKey) return;
  e.preventDefault();
  send();
});

box.addEventListener("input", () => {
  box.style.height = "auto";
  box.style.height = Math.min(box.scrollHeight, 160) + "px";
  sel = 0;
  refreshMenu();
});
box.addEventListener("blur", () => setTimeout(() => menu.classList.remove("open"), 120));
stop.onclick = () => agentWs?.send(JSON.stringify({ type: "interrupt" }));


modeSel.onchange = () => {
  if (modeSel.value === "bypassPermissions" &&
      !confirm("Never ask: Claude runs commands and edits files with nobody approving. Continue?")) {
    modeSel.value = "default";
  }
  agentWs?.send(JSON.stringify({ type: "mode", mode: modeSel.value }));
};

let CHATS = [], ACTIVE = null, cwdShown = "", modelShown = "";
let streaming = null, streamRaw = "";
const chatList = document.getElementById("chatlist");

function ago(ts) {
  const s = Math.max(0, (Date.now() - ts) / 1000);
  if (s < 60) return "just now";
  if (s < 3600) return `${Math.floor(s / 60)}m ago`;
  if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
  return `${Math.floor(s / 86400)}d ago`;
}

function renderChats() {
  if (!CHATS.length) {
    chatList.replaceChildren(Object.assign(document.createElement("div"),
      { className: "empty", textContent: "No saved chats yet." }));
    return;
  }
  chatList.replaceChildren(...CHATS.map(c => {
    const row = document.createElement("div");
    row.className = "row" + (c.id === ACTIVE ? " active" : "");
    const t = document.createElement("span"); t.className = "t"; t.textContent = c.title;
    const w = document.createElement("span"); w.className = "w";
    w.textContent = `${c.turns} turn${c.turns === 1 ? "" : "s"} · ${ago(c.updatedAt)}`;
    const x = document.createElement("span"); x.className = "x"; x.textContent = "✕"; x.title = "Delete";
    x.onclick = (e) => {
      e.stopPropagation();
      if (confirm(`Delete "${c.title}"?`)) agentWs?.send(JSON.stringify({ type: "delete", id: c.id }));
    };
    row.onclick = () => {
      chatList.classList.remove("open");
      if (c.id !== ACTIVE) agentWs?.send(JSON.stringify({ type: "open", id: c.id }));
    };
    row.append(t, w, x);
    return row;
  }));
}

document.getElementById("chats").onclick = (e) => {
  e.stopPropagation();
  // Anchor under the button rather than a guessed offset.
  const b = e.currentTarget.getBoundingClientRect();
  chatList.style.left = `${b.left}px`;
  chatList.classList.toggle("open");
};
document.addEventListener("click", (e) => {
  if (!chatList.contains(e.target)) chatList.classList.remove("open");
});

document.getElementById("reset").onclick = () => {
  agentWs?.send(JSON.stringify({ type: "new" }));
  chatList.classList.remove("open");
};

const term = new Terminal({
  fontFamily: getComputedStyle(document.body).getPropertyValue("--mono").trim(),
  fontSize: 10,
  cursorBlink: true,
  scrollback: 10000,

});

let ptyWs;
function connectShell() {
  ptyWs = new WebSocket(url("/pty"));
  ptyWs.binaryType = "arraybuffer";

  ptyWs.onopen = () => {
    ptyWs.send(JSON.stringify({ type: "start", cols: term.cols, rows: term.rows }));
  };
  ptyWs.onmessage = (ev) => {
    if (ev.data instanceof ArrayBuffer) {
      term.write(new Uint8Array(ev.data));
      return;
    }
    const m = JSON.parse(ev.data);
    if (m.type === "exit") term.write(`\r\n\x1b[90m[shell exited (${m.code}) — reload to restart]\x1b[0m\r\n`);
  };
  ptyWs.onclose = () => term.write("\r\n\x1b[90m[disconnected]\x1b[0m\r\n");
}

term.onData((d) => {
  if (ptyWs?.readyState === WebSocket.OPEN) ptyWs.send(JSON.stringify({ type: "input", data: d }));
});

const sendResize = () => {
  fit.fit();
  if (ptyWs?.readyState === WebSocket.OPEN) {
    ptyWs.send(JSON.stringify({ type: "resize", cols: term.cols, rows: term.rows }));
  }
};
new ResizeObserver(sendResize).observe(document.getElementById("term"));

grip.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  grip.setPointerCapture(e.pointerId);
  const move = (ev) => {
    const pct = Math.min(85, Math.max(15, ((ev.clientX - split.getBoundingClientRect().left) / split.clientWidth) * 100));
    left.style.flex  = `0 0 ${pct}%`;

/* ---------------- files pane ---------------- */
const flist = document.getElementById("flist");
const fview = document.getElementById("fview");
const fpath = document.getElementById("fpath");
const fpick = document.getElementById("fpick");
let cwdPath = "";          // relative to the server's browsable root
let parentPath = null;
let filesRootNote = "";

/** First open: ask the server where the root is and where to start. */
async function openFiles() {
  try {
    const info = await fjson("/files/info");
    filesRootNote = info.root;
    document.getElementById("rightnote").textContent = info.root;
    await browse(info.start ?? "");
  } catch (e) {
    flist.replaceChildren(Object.assign(document.createElement("div"),
      { className: "row", textContent: `Cannot open file browser: ${e.message}` }));
  }
}

const fmtSize = (n) =>
  n < 1024 ? `${n} B`
  : n < 1024 ** 2 ? `${(n / 1024).toFixed(1)} KB`
  : n < 1024 ** 3 ? `${(n / 1024 ** 2).toFixed(1)} MB`
  : `${(n / 1024 ** 3).toFixed(2)} GB`;

const fmtWhen = (ms) => {
  if (!ms) return "";
  const d = new Date(ms), now = Date.now();
  return now - ms < 86400000
    ? d.toTimeString().slice(0, 5)
    : d.toISOString().slice(0, 10);
};

async function fjson(url, opts) {
  const r = await fetch(url, opts);
  const body = await r.json().catch(() => ({ error: `HTTP ${r.status}` }));
  if (!r.ok) throw new Error(body.error ?? `HTTP ${r.status}`);
  return body;
}

async function browse(path = "") {
  fview.hidden = true; flist.hidden = false;
  try {
    const d = await fjson(`/files/list?path=${encodeURIComponent(path)}`);
    cwdPath = d.path; parentPath = d.parent;
    const shown = "/" + (d.path || "");
    // Keep the tail, which is the part that identifies where you are.
    fpath.textContent = shown.length > 48 ? "…/" + shown.slice(-46) : shown;
    fpath.title = shown;
    flist.replaceChildren(...d.entries.map(rowFor));
    if (!d.entries.length) {
      flist.append(Object.assign(document.createElement("div"),
        { className: "row", textContent: "(empty)" }));
    }
  } catch (e) {
    flist.replaceChildren(Object.assign(document.createElement("div"),
      { className: "row", textContent: String(e.message) }));
  }
}

function rowFor(e) {
  const row = document.createElement("div");
  row.className = "row" + (e.kind === "dir" ? " dir" : "");
  const full = cwdPath ? `${cwdPath}/${e.name}` : e.name;

  const n = document.createElement("span");
  n.className = "n";
  n.textContent = e.kind === "dir" ? e.name + "/" : e.name;
  const s = document.createElement("span");
  s.className = "s";
  s.textContent = e.kind === "dir" ? "" : `${fmtSize(e.size)}  ${fmtWhen(e.mtime)}`;
  row.append(n, s);

  if (e.kind === "file") {
    const dl = document.createElement("span");
    dl.className = "dl"; dl.textContent = "↓"; dl.title = "Download";
    dl.onclick = (ev) => { ev.stopPropagation(); download(full, e.name); };
    row.append(dl);
  }
  row.onclick = () => (e.kind === "dir" ? browse(full) : view(full, e));
  return row;
}

/**
 * Fetched as a blob rather than linked directly: a plain <a href> navigation
 * sends no Origin header, and the server's guard wants one.
 */
async function download(path, name) {
  const r = await fetch(`/files/read?path=${encodeURIComponent(path)}`);
  if (!r.ok) { alert(`Download failed: ${r.status}`); return; }
  const url = URL.createObjectURL(await r.blob());
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

async function view(path, entry) {
  flist.hidden = true; fview.hidden = false;
  fview.replaceChildren();

  const hd = document.createElement("div");
  hd.className = "hd";
  const back = document.createElement("button");
  back.textContent = "← back";
  back.onclick = () => browse(cwdPath);
  const dl = document.createElement("button");
  dl.textContent = "Download";
  dl.onclick = () => download(path, entry.name);
  const label = document.createElement("span");
  label.textContent = `${entry.name} · ${fmtSize(entry.size)}`;
  hd.append(back, dl, label);
  fview.append(hd);

  if (/\.(png|jpe?g|gif|webp|svg|bmp|ico)$/i.test(entry.name)) {
    const r = await fetch(`/files/read?path=${encodeURIComponent(path)}`);
    const img = document.createElement("img");
    img.src = URL.createObjectURL(await r.blob());
    fview.append(img);
    return;
  }
  try {
    const d = await fjson(`/files/read?path=${encodeURIComponent(path)}&preview=1`);
    const pre = document.createElement("pre");
    pre.textContent = d.kind === "text"
      ? d.text + (d.truncated ? "\n…[truncated]" : "")
      : `Binary file, ${fmtSize(d.bytes)}. Use Download.`;
    fview.append(pre);
  } catch (e) {
    fview.append(Object.assign(document.createElement("pre"), { textContent: String(e.message) }));
  }
}

async function upload(fileList) {
  for (const f of fileList) {
    try {
      await fjson(`/files/upload?path=${encodeURIComponent(cwdPath)}&name=${encodeURIComponent(f.name)}`,
        { method: "POST", body: f, headers: { "Content-Type": "application/octet-stream" } });
    } catch (e) {
      alert(`Upload of ${f.name} failed: ${e.message}`);
    }
  }
  browse(cwdPath);
}

document.getElementById("fup").onclick = () => browse(parentPath ?? "");
document.getElementById("frefresh").onclick = () => browse(cwdPath);
document.getElementById("fcwd").onclick = () => {
  agentWs?.send(JSON.stringify({ type: "cwd", path: cwdPath }));
};
document.getElementById("fupload").onclick = () => fpick.click();
fpick.onchange = () => { if (fpick.files.length) upload([...fpick.files]); fpick.value = ""; };

for (const ev of ["dragenter", "dragover"]) {
  flist.addEventListener(ev, (e) => { e.preventDefault(); flist.classList.add("drop"); });
}
for (const ev of ["dragleave", "drop"]) {
  flist.addEventListener(ev, (e) => { e.preventDefault(); flist.classList.remove("drop"); });
}
flist.addEventListener("drop", (e) => {
  if (e.dataTransfer?.files?.length) upload([...e.dataTransfer.files]);
});

/* right-pane tabs */
const termEl = document.getElementById("term");
const filesEl = document.getElementById("files");
let filesLoaded = false;
document.querySelectorAll(".pane-hd .tab").forEach((tab) => {
  tab.onclick = () => {
    const wantFiles = tab.dataset.tab === "files";
    document.querySelectorAll(".pane-hd .tab").forEach((t) => t.classList.toggle("on", t === tab));
    termEl.hidden = wantFiles;
    filesEl.hidden = !wantFiles;
    document.getElementById("rightnote").textContent =
      wantFiles ? (filesRootNote || "") : "no approval gate";
    if (wantFiles) {
      if (!filesLoaded) { filesLoaded = true; openFiles(); }
    } else {
      // xterm mis-measures while display:none, so re-fit on the way back.
      requestAnimationFrame(() => { try { fit.fit(); sendResize(); } catch {} });
    }
  };
});

/* ---------------- prepared prompts ---------------- */
const plist = document.getElementById("plist");
let promptData = null;     // {host, prompts:[{...,filled}], all:[...]}
let editing = null;        // the prompt being edited, or {} for a new one

async function loadPrompts() {
  const r = await fetch("/prompts");
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  promptData = await r.json();
}

function renderPrompts() {
  plist.replaceChildren();
  if (!promptData) return;

  const scope = document.createElement("div");
  scope.className = "scope";
  scope.append(document.createTextNode(
    promptData.host ? `for ${promptData.host}` : "no page detected — generic prompts only"));
  const add = document.createElement("button");
  add.textContent = "+ new";
  add.onclick = (e) => { e.stopPropagation(); editing = { title: "", text: "", domains: [] }; renderPrompts(); };
  scope.append(add);
  plist.append(scope);

  const list = editing ? [] : promptData.prompts;
  if (!editing && !list.length) {
    plist.append(Object.assign(document.createElement("div"),
      { className: "empty", textContent: "No prompts apply here. Use + new." }));
  }

  for (const p of list) {
    const row = document.createElement("div");
    row.className = "p";
    const t = document.createElement("span");
    t.className = "t"; t.textContent = p.title; t.title = p.filled;
    row.append(t);
    if (p.domains.length) {
      const tag = document.createElement("span");
      tag.className = "tag"; tag.textContent = p.domains.join(" ");
      row.append(tag);
    }
    for (const [label, fn] of [
      ["✎", () => { editing = { ...p }; renderPrompts(); }],
      ["✕", async () => {
        if (!confirm(`Delete "${p.title}"?`)) return;
        await fetch(`/prompts/${p.id}`, { method: "DELETE" });
        await loadPrompts(); renderPrompts();
      }],
    ]) {
      const b = document.createElement("span");
      b.className = "act"; b.textContent = label;
      b.onclick = (e) => { e.stopPropagation(); fn(); };
      row.append(b);
    }
    // Click runs it. The filled copy is what goes in, so {url} and {selection}
    // are already resolved for the page you are on.
    row.onclick = () => {
      closePrompts();
      box.value = p.filled;
      box.focus();
      send();
    };
    plist.append(row);
  }

  if (editing) plist.append(editForm());
  plist.classList.add("open");
}

function editForm() {
  const wrap = document.createElement("div");
  wrap.className = "edit";
  const title = Object.assign(document.createElement("input"),
    { placeholder: "Title", value: editing.title ?? "" });
  const domains = Object.assign(document.createElement("input"),
    { placeholder: "Domains, space separated — blank means everywhere",
      value: (editing.domains ?? []).join(" ") });
  const text = Object.assign(document.createElement("textarea"),
    { placeholder: "The prompt. {url} {title} {host} {selection} get filled in.",
      value: editing.text ?? "" });
  const row = document.createElement("div");
  row.className = "row";
  const save = Object.assign(document.createElement("button"), { textContent: "Save", className: "allow" });
  save.onclick = async () => {
    const body = { id: editing.id, title: title.value, text: text.value,
                   domains: domains.value.split(/[\s,]+/).filter(Boolean) };
    const r = await fetch("/prompts", { method: "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (!r.ok) { alert((await r.json()).error ?? "could not save"); return; }
    editing = null; await loadPrompts(); renderPrompts();
  };
  const cancel = Object.assign(document.createElement("button"), { textContent: "Cancel" });
  cancel.onclick = () => { editing = null; renderPrompts(); };
  row.append(save, cancel);
  wrap.append(title, domains, text, row);
  return wrap;
}

const closePrompts = () => { plist.classList.remove("open"); editing = null; };

document.getElementById("prompts").onclick = async (e) => {
  e.stopPropagation();
  if (plist.classList.contains("open")) { closePrompts(); return; }
  plist.replaceChildren(Object.assign(document.createElement("div"),
    { className: "empty", textContent: "loading…" }));
  plist.classList.add("open");
  try { await loadPrompts(); renderPrompts(); }
  catch (err) {
    plist.replaceChildren(Object.assign(document.createElement("div"),
      { className: "empty", textContent: `Could not load prompts: ${err.message}` }));
  }
};
document.addEventListener("click", (e) => { if (!plist.contains(e.target)) closePrompts(); });

connectAgent();
connectShell();
</script>
</body>
</html>
