# Types and unit tests on every push. The browser suite is a separate job
# because it needs Chromium and Python; it is allowed to be the slow one.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  browser:
    name: browser suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: pip install pytest pytest-xdist playwright
      - run: python -m playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          CT_TIMEOUT_SCALE: "3"
      # The server browser drives a real Chromium over the DevTools protocol.
      # It ran in the unit job until 2026-09-15 and failed there twice on a
      # wait that 60 s did not fix: the runner image's Chrome is not the
      # browser the suite is written against. Point it at Playwright's, the
      # one this job just installed.
      - name: server browser (real Chromium)
        run: |
          export CODETERM_CHROMIUM="$(python -c 'from playwright.sync_api import sync_playwright
          p = sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          echo "using $CODETERM_CHROMIUM"
          npm run test:chromium
        env:
          CT_CHROMIUM_WAIT: "60000"
