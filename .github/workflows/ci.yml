# Types and unit tests on every push. The browser suite is a separate job
# because it needs Chromium and Python; it is allowed to be the slow one.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A shared runner is slower than a laptop and has no GPU; the suite's
      # waits scale with this rather than being padded one by one.
      - run: npm run check
        env:
          CT_CHROMIUM_WAIT: "60000"

  browser:
    name: browser suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: pip install pytest pytest-xdist playwright
      - run: python -m playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          CT_TIMEOUT_SCALE: "3"
